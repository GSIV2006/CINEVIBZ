  </text>
  <path
    d="M53 632v56m-7-7 7 7 7-7"
    fill="none"
    stroke="#F5EBD8"
    stroke-opacity=".45"
    stroke-width="2"
  />
  <text
    x="30"
    y="742"
    fill="#F5EBD8"
    font-family="Georgia,serif"
    font-size="40"
    font-style="italic"
  >
    06
  </text>
  <text
    x="112"
    y="736"
    fill="#F5EBD8"
    font-family="Arial,Helvetica,sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="1"
  >
    EXPLAIN
  </text>
  <text x="112" y="781" fill="#F5EBD8" font-family="Arial,Helvetica,sans-serif" font-size="27">
    Show the reason. Name the evidence.
  </text>
  <path d="M30 838h660" stroke="#F5EBD8" stroke-opacity=".3" />
  <text x="30" y="875" fill="#F5EBD8" font-family="monospace" font-size="19" letter-spacing="1.5">
    RELEVANCE OVER POPULARITY.
  </text>
</svg>
